receivers:
  hostmetrics:
    collection_interval: 10s
    scrapers:
      cpu:
      memory:
      network:
      disk:
      filesystem:
      load:
      paging:
      processes:

  filelog:
    include: [ /tmp/app.log ]
    start_at: beginning
    # operators:
    #   - type: regex_parser
    #     regex: '^(?P<message>.*)$'
    #     parse_to: body

processors:
  batch:
    send_batch_size: 1000
    timeout: 10s
    metadata_keys:
      - X-SF-Token
  resourcedetection:
    detectors: [gcp, ecs, ec2, azure, system]
    override: true
    
exporters:
  signalfx:
    access_token: "${SPLUNK_ACCESS_TOKEN}"
    api_url: "${SPLUNK_API_URL}"
    ingest_url: "${SPLUNK_INGRES_URL}"
    sync_host_metadata: true
    correlation:

  splunk_hec:
    token: "${SPLUNK_HEC_TOKEN}"
    endpoint: "${SPLUNK_HEC_URL}"
    source: "app"
    sourcetype: "_json"
    tls:
      insecure_skip_verify: true
      
service:
  pipelines:
    logs:
      receivers: [filelog]
      processors: [resourcedetection, batch]
      exporters: [splunk_hec]

    metrics:
      receivers: [hostmetrics]
      processors: [resourcedetection, batch]
      exporters: [signalfx]